baseline:
  controller: validation_tuned_fixed
  search_green_durations:
  - 45
exploration:
  epsilon_decay_decisions: 10000
  epsilon_end: 0.05
  epsilon_start: 1.0
model:
  feature_dim: 12
  gamma: 0.99
  hidden: 128
  lr: 0.0003
  n_step: 3
optimizer:
  batch_size: 128
  buffer_capacity: 200000
  grad_clip: 10.0
  huber_delta: 1.0
  target_sync: 500
  train_start: 2000
reward:
  downstream_block_weight: 0.2
  queue_weight: 1.0
  switch_penalty: 0.05
schema_version: 2
tiers:
  final:
    episodes: 80
    eval_every: 20
    horizon_seconds: 3600
  pilot:
    episodes: 12
    eval_every: 4
    horizon_seconds: 3600
  smoke:
    episodes: 3
    eval_every: 3
    horizon_seconds: 120
    require_optimizer_updates: true
    train_start: 512
