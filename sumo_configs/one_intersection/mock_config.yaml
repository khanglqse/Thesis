# Mock SUMO Configuration for Single Intersection
# Used when SUMO/TraCI is not available for testing

network:
  intersections:
    - id: "center"
      position: [0, 0]
      type: "traffic_light"
      
  lanes:
    # North-South direction
    - id: "north_center_0"
      from: "north"
      to: "center"
      direction: "south"
      vehicle_types: ["passenger", "motorcycle", "taxi"]
      
    - id: "north_center_1"
      from: "north"
      to: "center"
      direction: "south"
      vehicle_types: ["truck", "bus", "passenger"]
      
    - id: "south_center_0"
      from: "south"
      to: "center"
      direction: "north"
      vehicle_types: ["passenger", "motorcycle", "taxi"]
      
    - id: "south_center_1"
      from: "south"
      to: "center"
      direction: "north"
      vehicle_types: ["truck", "bus", "passenger"]
      
    # East-West direction
    - id: "east_center_0"
      from: "east"
      to: "center"
      direction: "west"
      vehicle_types: ["passenger", "motorcycle", "taxi"]
      
    - id: "east_center_1"
      from: "east"
      to: "center"
      direction: "west"
      vehicle_types: ["truck", "bus", "passenger"]
      
    - id: "west_center_0"
      from: "west"
      to: "center"
      direction: "east"
      vehicle_types: ["passenger", "motorcycle", "taxi"]
      
    - id: "west_center_1"
      from: "west"
      to: "center"
      direction: "east"
      vehicle_types: ["truck", "bus", "passenger"]
      
    # From center outward
    - id: "center_north_0"
      from: "center"
      to: "north"
      direction: "north"
      vehicle_types: ["passenger", "motorcycle", "taxi"]
      
    - id: "center_north_1"
      from: "center"
      to: "north"
      direction: "north"
      vehicle_types: ["truck", "bus", "passenger"]
      
    - id: "center_south_0"
      from: "center"
      to: "south"
      direction: "south"
      vehicle_types: ["passenger", "motorcycle", "taxi"]
      
    - id: "center_south_1"
      from: "center"
      to: "south"
      direction: "south"
      vehicle_types: ["truck", "bus", "passenger"]
      
    - id: "center_west_0"
      from: "center"
      to: "west"
      direction: "west"
      vehicle_types: ["passenger", "motorcycle", "taxi"]
      
    - id: "center_west_1"
      from: "center"
      to: "west"
      direction: "west"
      vehicle_types: ["truck", "bus", "passenger"]
      
    - id: "center_east_0"
      from: "center"
      to: "east"
      direction: "east"
      vehicle_types: ["passenger", "motorcycle", "taxi"]
      
    - id: "center_east_1"
      from: "center"
      to: "east"
      direction: "east"
      vehicle_types: ["truck", "bus", "passenger"]

traffic_light:
  intersections:
    - id: "center"
      phases:
        - id: 0
          duration: 30
          state: "GGGrrrr"  # North-South Green
          
        - id: 1
          duration: 3
          state: "yyyyyyy"  # Yellow transition
          
        - id: 2
          duration: 30
          state: "rrrGGGrrr"  # East-West Green
          
        - id: 3
          duration: 3
          state: "rrryyyyrrr"  # Yellow transition
          
      current_phase: 0

vehicle_types:
  passenger:
    length: 4.5
    max_speed: 13.89  # 50 km/h
    speed_factor: 1.0
    probability: 0.4
    
  motorcycle:
    length: 2.0
    max_speed: 11.11  # 40 km/h
    speed_factor: 1.1
    probability: 0.4
    
  truck:
    length: 7.5
    max_speed: 11.11  # 40 km/h
    speed_factor: 0.9
    probability: 0.1
    
  bus:
    length: 12.0
    max_speed: 11.11  # 40 km/h
    speed_factor: 0.95
    probability: 0.05
    
  taxi:
    length: 4.5
    max_speed: 13.89  # 50 km/h
    speed_factor: 1.0
    probability: 0.05

traffic_patterns:
  # Vietnam-style traffic: heavy motorcycle presence
  base_flow_rate: 0.18  # vehicles per second per direction
  motorcycle_ratio: 0.4  # 40% motorcycles
  bus_frequency: 180  # seconds between buses
  
  flow_rates:
    north_south: 0.18
    south_north: 0.18
    east_west: 0.18
    west_east: 0.18

simulation:
  step_length: 1  # seconds
  total_time: 3600  # 1 hour
  seed: 42

metrics:
  track:
    - vehicle_count
    - average_speed
    - waiting_time
    - queue_length
    - delay

