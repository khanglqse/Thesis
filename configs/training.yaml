# DQN parameter-sharing training hyperparameters.
# Tuned to the emulated-CityFlow time budget (the simulator runs under amd64
# emulation). The dense Vietnamese flow (~13k vehicles) saturates the network by
# ~step 300, so a 600-step horizon already exercises the full congested regime
# while keeping wall-clock feasible. 40 episodes x 60 decisions = 2400 decisions,
# so epsilon_decay_steps=1800 reaches the exploit regime around episode 30.
episodes: 60
max_steps: 800           # match the eval horizon (= 80 decisions @ interval 10)
action_interval: 10      # decision every 10 sim-seconds
yellow_time: 3
min_green: 10
count_norm: 40           # lane-count normaliser; raised for the dense VN flow (~13k veh)
hidden: 128              # more capacity for the harder, congested scenario
lr: 0.0003
reward_scale: 0.05       # arterial net pressure reward is ~-15..-25; scale to O(1) for stable TD targets
grad_clip: 10.0          # global grad-norm cap; stops Q-value divergence
huber_delta: 1.0         # Huber loss threshold; bounds gradient on large TD errors
gamma: 0.99
reward_type: pressure    # pressure | queue | queue_norm | pressure_norm | efficient_pressure
state_mode: basic        # basic | ats (Advanced-XLight: adds running-vehicle / approaching-demand channel)
dueling: false           # dueling DQN head (value + advantage streams); experiment toggle
n_step: 1                # n-step returns (1 = standard 1-step DQN); 3-5 helps delayed credit
eval_every: 0            # >0: every N episodes roll the greedy policy and keep the best-by-greedy-eval checkpoint (proper early stopping; DQN here peaks then diverges)
warmstart_steps: 0       # >0: behaviour-clone Max-Pressure for N decisions before RL (warm start)
warmstart_epsilon: 0.3   # RL epsilon_start after a warm start (exploit the imitated policy)
fixed_green_duration: 40 # seconds of green per phase for the Fixed-Time baseline (realistic 25-50s)
batch_size: 64
buffer_capacity: 100000
train_start: 500         # min transitions before learning (filled in ~7 decisions @73 agents)
target_sync: 200         # train-steps between target syncs
epsilon_start: 1.0
epsilon_end: 0.05
epsilon_decay_steps: 3000   # linear decay over decisions; 60ep x 80dec=4800, exploit ~ep37
seed: 42
