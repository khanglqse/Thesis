# DQN parameter-sharing training hyperparameters.
# Tuned to the emulated-CityFlow time budget (the simulator runs under amd64
# emulation). The dense Vietnamese flow (~13k vehicles) saturates the network by
# ~step 300, so a 600-step horizon already exercises the full congested regime
# while keeping wall-clock feasible. 40 episodes x 60 decisions = 2400 decisions,
# so epsilon_decay_steps=1800 reaches the exploit regime around episode 30.
episodes: 40
max_steps: 600           # engine steps per episode (= 60 decisions @ interval 10)
action_interval: 10      # decision every 10 sim-seconds
yellow_time: 3
min_green: 10
count_norm: 40           # lane-count normaliser; raised for the dense VN flow (~13k veh)
hidden: 128              # more capacity for the harder, congested scenario
lr: 0.0003
reward_scale: 0.25       # scale pressure reward (~-4 dense) to O(1) -> stable TD targets
grad_clip: 10.0          # global grad-norm cap; stops Q-value divergence
huber_delta: 1.0         # Huber loss threshold; bounds gradient on large TD errors
gamma: 0.99
batch_size: 64
buffer_capacity: 100000
train_start: 500         # min transitions before learning (filled in ~7 decisions @73 agents)
target_sync: 150         # train-steps between target syncs
epsilon_start: 1.0
epsilon_end: 0.05
epsilon_decay_steps: 1800   # linear decay over decisions; reached ~episode 30
seed: 42
