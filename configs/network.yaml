# Bounding boxes: [west, south, east, north]
bbox:
  # Small validation sub-area (a few signalized intersections near the center).
  subarea: [108.215, 16.045, 108.235, 16.065]
  # Full central Da Nang.
  full: [108.12, 16.00, 108.28, 16.08]
  # Hai Chau District only (Quan Hai Chau) — central district, smaller & far more
  # watchable in the replay. bbox from OSM Nominatim: [W, S, E, N].
  haichau: [108.1888, 16.0213, 108.2360, 16.1037]

netconvert:
  # Options applied when converting OSM -> SUMO net (see osm_to_sumo.py).
  tls_default_type: actuated
  # Scope the network to its arterial grid: drop residential alleys so demand is
  # forced through the signal-controlled intersections (see
  # docs/network_demand_analysis.md). Kept: trunk/primary/secondary/tertiary
  # (+links), unclassified, living_street.
  drop_road_types:
    - highway.residential

flow:
  start_time: 0
  end_time: 3600        # 1 hour of generated demand
  num_flows: 500        # distinct route-flows (more entry pressure -> sustained load)
  route_length: 6       # roads per route (longer trips cross more signals)
  interval: 1.5         # seconds between vehicle emissions per flow (denser inflow)
  seed: 42
  # Vehicle mix: motorbike-dominant chaos, like a Vietnamese city (Da Nang ~90% bikes).
  motorbike_ratio: 0.92
