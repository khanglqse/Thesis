schema_version: 2
dataset_id: haichau_network_v2
roadnet: datasets/haichau_network_v2/roadnet.json
phase_contract:
  path: datasets/haichau_network_v2/phase-contract.json
  sha256: 41c10aa7de5da3c7cd215577a7929ee8495ba3317d8e094a9d92cdb90611acae
provenance:
  path: datasets/haichau_network_v2/provenance.json
  sha256: a922a79f032eaab96c204b7696703022424ade809bf9fe8aa1452fc9fc6db409
demand_label: synthetic_osm_haichau_constrained_by_danang_profiles
route_count: 500
min_controlled_signals_per_route: 2
horizon_seconds: 3600
motorcycle_ratio: 0.90
reference_interval_seconds: 240
route_family_split: {train: 0.50, validation: 0.25, test: 0.25}
route_coverage:
  required_controlled_signals: all
  minimum_route_families_per_signal: 3
  max_route_stretch_ratio: 1.25
  require_each_split: true
  require_each_case: true
temporal_profile_source:
  path: datasets/danang_published/phan2025_camera_hourly_digitized.csv
  sha256: 5dbfb6282b45996932fa6ed1f8378a910d83fc467fd858b4e58360c6cb9295fa
  aggregation_fields: [car_veh_per_h, motorcycle_veh_per_h, truck_veh_per_h, bus_veh_per_h]
  derivation: sum all four camera lines and movements at each source hour; interval = reference_interval * mean(normal source counts) / source-hour count
regimes:
  normal:
    profile_bins:
      - {start: 0, end: 1200, source_hour: "12:00", source_vehicle_count: 1910}
      - {start: 1200, end: 2400, source_hour: "13:00", source_vehicle_count: 1395}
      - {start: 2400, end: 3600, source_hour: "14:00", source_vehicle_count: 1505}
  am_peak:
    profile_bins:
      - {start: 0, end: 1200, source_hour: "07:00", source_vehicle_count: 1255}
      - {start: 1200, end: 2400, source_hour: "08:00", source_vehicle_count: 2330}
      - {start: 2400, end: 3600, source_hour: "09:00", source_vehicle_count: 1870}
  pm_peak:
    profile_bins:
      - {start: 0, end: 1200, source_hour: "16:00", source_vehicle_count: 1755}
      - {start: 1200, end: 2400, source_hour: "17:00", source_vehicle_count: 2400}
      - {start: 2400, end: 3600, source_hour: "18:00", source_vehicle_count: 2490}
splits:
  train: {demand_seeds: [11, 12, 13], sim_seeds: [111, 112, 113]}
  validation: {demand_seeds: [31, 32], sim_seeds: [131, 132]}
  test: {demand_seeds: [101, 102, 103, 104, 105], sim_seeds: [201, 202, 203, 204, 205]}
simulation:
  action_interval: 10
  yellow_time: 3
  min_green: 20
  maximum_red: 180
preprocessing:
  count_norm: 20.0
  capacity_norm: 40.0
