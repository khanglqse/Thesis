# Diagnostic-only CityFlow smoke for v3-A mechanics and step-0 evidence.
# This config is never eligible for pilot selection or test evaluation.
schema_version: 2
observation:
  schema_version: 3
  type: phase_rows_fixed_schedule_context
  phase_row_identity: cycle_fraction
  global_cycle:
    encoding: sin_cos
    green_duration_seconds: 25
    period: green_duration_times_selectable_green_count
model: {feature_dim: 15, hidden: 128, lr: 0.0003, gamma: 0.99, n_step: 3}
optimizer: {batch_size: 128, buffer_capacity: 200000, train_start: 2000, target_sync: 500, grad_clip: 10.0, huber_delta: 1.0}
exploration: {epsilon_start: 0.10, epsilon_end: 0.02, epsilon_decay_decisions: 36}
behavior_prior:
  type: fixed_time_behavior_cloning
  bc_epochs: 1
  pre_rl_validation: true
  reference_probability_start: 0.0
  reference_probability_end: 0.0
  random_probability_start: 0.10
  random_probability_end: 0.02
  minimum_validation_reference_disagreement_rate: 0.01
  rehearsal:
    enabled: true
    type: behavior_clone
    every_td_updates: 1
    batch_size: 128
reward: {queue_weight: 1.0, downstream_block_weight: 0.2, switch_penalty: 0.05}
baseline: {controller: validation_tuned_fixed, search_green_durations: [25]}
tiers:
  smoke: {episodes: 3, horizon_seconds: 120, eval_every: 3, train_start: 512, require_optimizer_updates: true}
  pilot: {episodes: 12, horizon_seconds: 3600, eval_every: 4}
  final: {episodes: 12, horizon_seconds: 3600, eval_every: 4}
